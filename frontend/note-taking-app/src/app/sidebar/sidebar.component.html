<div
  class="offcanvas offcanvas-start gk-sidebar"
  tabindex="-1"
  id="sidebar"
  aria-labelledby="sidebarLabel"
>
  <!-- Spacer that mirrors the navbar height so items start below it -->
  <div class="gk-sidebar-top">
    <span class="visually-hidden" id="sidebarLabel">Navigation</span>
  </div>

  <div class="offcanvas-body gk-sidebar-body">
    <!-- Default nav items -->
    <nav aria-label="Main navigation">
      <ul class="gk-nav-list">
        <li>
          <a href="#" class="gk-nav-item active" aria-current="page">
            <i class="bi bi-lightbulb gk-nav-icon"></i>
            <span>Notes</span>
          </a>
        </li>
        <li>
          <a href="#" class="gk-nav-item">
            <i class="bi bi-bell gk-nav-icon"></i>
            <span>Reminders</span>
          </a>
        </li>
      </ul>
    </nav>

    <!-- Labels section -->
    <div class="gk-section-divider"></div>
    <div class="gk-section-header">
      <span>Labels</span>
      <button
        class="btn gk-edit-btn"
        aria-label="Edit labels"
        (click)="toggleEditing()"
      >
        {{ editingLabels ? "Done" : "Edit" }}
      </button>
    </div>

    <nav aria-label="Labels">
      <ul class="gk-nav-list">
        <li *ngFor="let label of labels(); let i = index">

          <!-- Edit mode row -->
          <div *ngIf="editingLabels" class="gk-label-edit-row">
            <button
              class="gk-label-icon-btn gk-delete-btn"
              (click)="deleteLabel(i)"
              aria-label="Delete label"
            >
              <i class="bi bi-dash-circle"></i>
            </button>

            <input
              *ngIf="editingIndex === i"
              class="gk-label-input"
              type="text"
              [(ngModel)]="editingText"
              (blur)="saveEdit(i)"
              (keydown)="onEditKeydown($event, i)"
              aria-label="Edit label name"
              autofocus
            />
            <span
              *ngIf="editingIndex !== i"
              class="gk-label-edit-text"
              (click)="startEditing(i)"
            >{{ label.name }}</span>

            <button
              class="gk-label-icon-btn"
              (click)="startEditing(i)"
              aria-label="Edit label"
            >
              <i class="bi bi-pencil"></i>
            </button>
          </div>

          <!-- Normal nav item -->
          <a
            *ngIf="!editingLabels"
            href="#"
            class="gk-nav-item"
          >
            <i class="bi bi-tag gk-nav-icon"></i>
            <span>{{ label.name }}</span>
          </a>
        </li>

        <!-- New label input row (edit mode only) -->
        <li *ngIf="editingLabels">
          <div class="gk-label-edit-row gk-new-label-row">
            <i class="bi bi-plus gk-new-label-icon"></i>
            <input
              class="gk-label-input"
              type="text"
              [(ngModel)]="newLabelText"
              placeholder="Create new label"
              (keydown)="onNewLabelKeydown($event)"
              aria-label="New label name"
            />
            <button
              class="gk-label-icon-btn"
              (click)="addLabel()"
              [disabled]="!newLabelText.trim()"
              aria-label="Add label"
            >
              <i class="bi bi-check"></i>
            </button>
          </div>
        </li>
      </ul>
    </nav>

    <!-- Bottom items -->
    <div class="gk-section-divider"></div>
    <nav aria-label="Other">
      <ul class="gk-nav-list">
        <li>
          <a href="#" class="gk-nav-item">
            <i class="bi bi-archive gk-nav-icon"></i>
            <span>Archive</span>
          </a>
        </li>
        <li>
          <a href="#" class="gk-nav-item">
            <i class="bi bi-trash gk-nav-icon"></i>
            <span>Trash</span>
          </a>
        </li>
      </ul>
    </nav>
  </div>
</div>
