<div
  class="gk-card"
  [style.background-color]="note.color || '#fff'"
  (mouseenter)="hovered = true"
  (mouseleave)="hovered = false"
  (click)="onCardClick()"
  role="button"
  [attr.aria-label]="note.title || 'Untitled note'"
  tabindex="0"
  (keydown.enter)="onCardClick()"
>
  <!-- Pin button -->
  <button
    class="gk-pin-btn"
    [class.gk-pin-btn--active]="note.pinned"
    [class.gk-pin-btn--visible]="hovered || note.pinned"
    (click)="onPin($event)"
    [attr.aria-label]="note.pinned ? 'Unpin note' : 'Pin note'"
  >
    <i
      class="bi"
      [class.bi-pin-angle]="!note.pinned"
      [class.bi-pin-angle-fill]="note.pinned"
    ></i>
  </button>

  <!-- Title -->
  <div class="gk-card-title" *ngIf="note.title">{{ note.title }}</div>

  <!-- Body -->
  <div class="gk-card-body" *ngIf="note.content">{{ note.content }}</div>
  <div class="gk-card-body" *ngIf="note.passwordProtected">
    <i class="bi bi-shield-slash"></i>
  </div>
  <!-- Label chips -->
  <div class="gk-card-labels" *ngIf="note.tags?.length">
    <span class="gk-label-chip" *ngFor="let label of note.tags">{{
      label
    }}</span>
  </div>

  <!-- Hover toolbar -->
  <div
    class="gk-card-toolbar"
    [class.gk-card-toolbar--visible]="hovered || labelPickerOpen"
  >
    <button
      class="btn gk-tool-btn"
      (click)="onArchive($event)"
      aria-label="Archive note"
    >
      <i class="bi bi-archive"></i>
    </button>
    <button
      class="btn gk-tool-btn"
      (click)="onDelete($event)"
      aria-label="Delete note"
    >
      <i class="bi bi-trash"></i>
    </button>
    <button
      class="btn gk-tool-btn"
      *ngIf="note.passwordProtected"
      (click)="onUnlock($event)"
      aria-label="Unlock note"
    >
      <i class="bi bi-unlock"></i>
    </button>
    <button
      class="btn gk-tool-btn"
      *ngIf="!note.passwordProtected"
      (click)="onLock($event)"
      aria-label="Lock note"
    >
      <i class="bi bi-lock"></i>
    </button>

    <!-- Label button + picker -->
    <div class="gk-label-picker-anchor" (click)="$event.stopPropagation()">
      <button
        class="btn gk-tool-btn"
        [class.gk-tool-btn--active]="labelPickerOpen"
        (click)="onAddLabel($event)"
        aria-label="Add label"
      >
        <i class="bi bi-tag"></i>
      </button>

      <!-- Dropdown -->
      <div class="gk-label-picker" *ngIf="labelPickerOpen">
        <div class="gk-label-picker-header">Label note</div>
        <div class="gk-label-search-wrapper">
          <input
            class="gk-label-search"
            type="text"
            placeholder="Search labels"
            [(ngModel)]="searchTextSignal"
            (click)="$event.stopPropagation()"
            aria-label="Search labels"
          />
        </div>
        <ul class="gk-label-picker-list">
          <li
            *ngFor="let label of filteredLabels()"
            class="gk-label-picker-item"
            [class.gk-label-picker-item--checked]="hasLabel(label)"
            (click)="toggleLabel($event, label)"
          >
            <span class="gk-label-checkbox">
              <i
                class="bi"
                [class.bi-check-square-fill]="hasLabel(label)"
                [class.bi-square]="!hasLabel(label)"
              ></i>
            </span>
            <span class="gk-label-name">{{ label.name }}</span>
          </li>
          <li
            *ngIf="filteredLabels().length === 0"
            class="gk-label-picker-empty"
          >
            No matching labels
          </li>
        </ul>
      </div>
    </div>
  </div>
</div>
