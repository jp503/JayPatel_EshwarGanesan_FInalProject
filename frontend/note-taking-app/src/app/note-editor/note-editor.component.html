<!-- Backdrop -->
<div class="gk-backdrop" (click)="onBackdropClick()"></div>

<!-- Editor panel -->
<div
  class="gk-editor"
  [style.background-color]="editNote.color || '#ffffff'"
  role="dialog"
  aria-modal="true"
  aria-label="Edit note"
  (click)="$event.stopPropagation()"
>
  <!-- Pin button -->
  <button
    class="gk-pin-btn"
    [class.gk-pin-btn--active]="editNote.pinned"
    (click)="togglePin()"
    [attr.aria-label]="editNote.pinned ? 'Unpin note' : 'Pin note'"
  >
    <i
      class="bi"
      [class.bi-pin-angle]="!editNote.pinned"
      [class.bi-pin-angle-fill]="editNote.pinned"
    ></i>
  </button>

  <!-- Title input -->
  <input
    #titleInput
    class="gk-title-input"
    type="text"
    placeholder="Title"
    [(ngModel)]="editNote.title"
    aria-label="Note title"
  />

  <!-- Body textarea -->
  <textarea
    #bodyInput
    class="gk-body-input"
    placeholder="Take a note..."
    [(ngModel)]="editNote.content"
    (input)="autoResize($event)"
    aria-label="Note body"
    rows="1"
  ></textarea>

  <!-- Reminder chip (if set) -->

  <!-- Bottom toolbar -->
  <div class="gk-editor-toolbar">
    <div class="gk-toolbar-left">
      <button
        class="btn gk-tool-btn"
        (click)="toggleMoreMenu()"
        aria-label="More options"
        [class.gk-tool-btn--active]="moreMenuOpen"
      >
        <i class="bi bi-three-dots-vertical"></i>
      </button>

      <!-- More menu -->
      <div class="gk-more-menu" *ngIf="moreMenuOpen">
        <button class="gk-more-item" (click)="onDelete()">
          <i class="bi bi-trash"></i> Delete note
        </button>
        <button class="gk-more-item" (click)="onAddLabel()">
          <i class="bi bi-tag"></i> Add label
        </button>
        <button class="gk-more-item" (click)="onMakeCopy()">
          <i class="bi bi-files"></i> Make a copy
        </button>
      </div>
    </div>

    <div class="gk-toolbar-right">
      <button class="btn gk-close-btn" (click)="onClose()">Close</button>
    </div>
  </div>
</div>
